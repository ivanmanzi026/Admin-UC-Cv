<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ProCV</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="admin-login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <span class="logo-icon">📄</span>
                    <span class="logo-text">Pro<span class="highlight">CV</span></span>
                    <span class="admin-badge">Admin</span>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to manage your ProCV platform</p>
            </div>

            <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="adminEmail">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        id="adminEmail" 
                        class="form-control" 
                        placeholder="admin@procv.com" 
                        required
                        value="admin@procv.com"
                    >
                </div>

                <div class="form-group">
                    <label for="adminPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="adminPassword" 
                            class="form-control" 
                            placeholder="••••••••" 
                            required
                            value="admin123"
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>

                <div id="loginError" class="login-error" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorMessage">Invalid credentials</span>
                </div>
            </form>

            <div class="login-footer">
                <p>Protected by <strong>ProCV Security</strong></p>
                <div class="security-badge">
                    <i class="fas fa-shield-alt"></i> Secure Login
                </div>
            </div>
        </div>

        <div class="login-info">
            <div class="info-item">
                <i class="fas fa-database"></i>
                <div>
                    <h4>Demo Credentials</h4>
                    <p>Email: admin@procv.com</p>
                    <p>Password: admin123</p>
                </div>
            </div>
            <div class="info-item">
                <i class="fas fa-exclamation-triangle"></i>
                <div>
                    <h4>Security Notice</h4>
                    <p>This is a demo. Production authentication must be server-side.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
