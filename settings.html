<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - ProCV Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <!-- ===== SIDEBAR ===== -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-brand">
            <span class="logo-icon">📄</span>
            <span class="logo-text">Pro<span class="highlight">CV</span></span>
            <span class="admin-badge">Admin</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-chart-pie"></i>
                <span>Dashboard</span>
            </a>
            <a href="users.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>
            <a href="templates.html" class="nav-item">
                <i class="fas fa-palette"></i>
                <span>Templates</span>
            </a>
            <a href="payments.html" class="nav-item">
                <i class="fas fa-credit-card"></i>
                <span>Payments</span>
            </a>
            <a href="plans.html" class="nav-item">
                <i class="fas fa-crown"></i>
                <span>Plans</span>
            </a>
            <a href="settings.html" class="nav-item active">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="admin-user">
                <div class="admin-avatar">A</div>
                <div class="admin-info">
                    <span class="admin-name">Admin</span>
                    <span class="admin-role">Super Admin</span>
                </div>
                <button class="logout-btn" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="admin-main">
        <header class="admin-topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>Settings</h1>
            </div>
            <div class="topbar-right">
                <div class="admin-profile">
                    <span>Admin</span>
                    <img src="https://ui-avatars.com/api/?name=Admin&background=2563EB&color=fff&size=32" alt="Admin">
                </div>
            </div>
        </header>

        <div class="page-content">
            <div class="settings-container">
                <!-- General Settings -->
                <div class="settings-section">
                    <h2>General Settings</h2>
                    <form id="generalSettings" onsubmit="saveGeneralSettings(event)">
                        <div class="form-group">
                            <label>Website Name</label>
                            <input type="text" id="websiteName" class="form-control" value="ProCV">
                        </div>
                        <div class="form-group">
                            <label>Website Logo URL</label>
                            <input type="url" id="websiteLogo" class="form-control" value="/assets/logo.png">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Default Currency</label>
                                <select id="defaultCurrency" class="form-control">
                                    <option value="RWF" selected>RWF - Rwandan Franc</option>
                                    <option value="USD">USD - US Dollar</option>
                                    <option value="EUR">EUR - Euro</option>
                                    <option value="KES">KES - Kenyan Shilling</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Contact Email</label>
                                <input type="email" id="contactEmail" class="form-control" value="support@procv.com">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Save Settings
                        </button>
                    </form>
                </div>

                <!-- Security Settings -->
                <div class="settings-section">
                    <h2>Security Settings</h2>
                    <form id="securitySettings" onsubmit="saveSecuritySettings(event)">
                        <div class="form-group">
                            <label>Admin Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="adminPassword" class="form-control" placeholder="••••••••">
                                <button type="button" class="toggle-password" onclick="toggleSettingsPassword()">
                                    <i class="fas fa-eye" id="settingsPasswordIcon"></i>
                                </button>
                            </div>
                            <p class="help-text">Leave blank to keep current password</p>
                        </div>
                        <div class="form-group">
                            <label>Confirm New Password</label>
                            <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Password
                        </button>
                    </form>
                </div>

                <!-- Admin Profile -->
                <div class="settings-section">
                    <h2>Admin Profile</h2>
                    <form id="adminProfile" onsubmit="saveAdminProfile(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="adminName" class="form-control" value="Admin">
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" id="adminEmail" class="form-control" value="admin@procv.com">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Profile
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
