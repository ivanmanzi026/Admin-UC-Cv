<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - ProCV Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <!-- ===== SIDEBAR ===== -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-brand">
            <span class="logo-icon">📄</span>
            <span class="logo-text">Pro<span class="highlight">CV</span></span>
            <span class="admin-badge">Admin</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-chart-pie"></i>
                <span>Dashboard</span>
            </a>
            <a href="users.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>
            <a href="templates.html" class="nav-item">
                <i class="fas fa-palette"></i>
                <span>Templates</span>
            </a>
            <a href="payments.html" class="nav-item active">
                <i class="fas fa-credit-card"></i>
                <span>Payments</span>
                <span class="nav-badge" id="paymentCount">0</span>
            </a>
            <a href="plans.html" class="nav-item">
                <i class="fas fa-crown"></i>
                <span>Plans</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="admin-user">
                <div class="admin-avatar">A</div>
                <div class="admin-info">
                    <span class="admin-name">Admin</span>
                    <span class="admin-role">Super Admin</span>
                </div>
                <button class="logout-btn" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="admin-main">
        <header class="admin-topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>Payments</h1>
            </div>
            <div class="topbar-right">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="paymentSearch" placeholder="Search payments...">
                </div>
                <div class="admin-profile">
                    <span>Admin</span>
                    <img src="https://ui-avatars.com/api/?name=Admin&background=2563EB&color=fff&size=32" alt="Admin">
                </div>
            </div>
        </header>

        <div class="page-content">
            <div class="page-header">
                <div>
                    <h2>Payments</h2>
                    <p>View all payment transactions</p>
                </div>
                <div class="header-stats">
                    <div class="mini-stat">
                        <span class="stat-label">Total Revenue</span>
                        <span class="stat-value" id="totalRevenue">RWF 0</span>
                    </div>
                    <div class="mini-stat">
                        <span class="stat-label">Successful</span>
                        <span class="stat-value success" id="successfulCount">0</span>
                    </div>
                    <div class="mini-stat">
                        <span class="stat-label">Failed</span>
                        <span class="stat-value danger" id="failedCount">0</span>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="table-filters">
                <div class="filter-group">
                    <select class="filter-select" id="statusFilter">
                        <option value="all">All Status</option>
                        <option value="successful">Successful</option>
                        <option value="pending">Pending</option>
                        <option value="failed">Failed</option>
                        <option value="refunded">Refunded</option>
                    </select>
                </div>
                <button class="btn btn-outline" onclick="resetFilters()">
                    <i class="fas fa-undo"></i> Reset
                </button>
            </div>

            <!-- Payments Table -->
            <div class="table-container">
                <table class="admin-table" id="paymentsTable">
                    <thead>
                        <tr>
                            <th>Transaction ID</th>
                            <th>User</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="paymentsTableBody">
                        <tr>
                            <td colspan="6" style="text-align:center;padding:40px;color:var(--gray-500);">
                                <i class="fas fa-spinner fa-spin" style="font-size:24px;display:block;margin-bottom:8px;"></i>
                                Loading payments...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="table-pagination">
                <span class="pagination-info" id="paginationInfo">Showing 0 payments</span>
                <div class="pagination-controls">
                    <button class="page-btn" id="prevPage" disabled><i class="fas fa-chevron-left"></i></button>
                    <span id="pageNumbers"></span>
                    <button class="page-btn" id="nextPage" disabled><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== TOAST CONTAINER ===== -->
    <div id="toastContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/payments.js"></script>
</body>
</html>
